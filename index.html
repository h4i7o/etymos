<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Etymology Map">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="firebase-config.js"></script>
<link rel="icon" href="icon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon.ico">
<title>Etymology Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: monotone gradient ground, glass sidebar (index) + glass reading pane.
   Phone: one view at a time on a nav stack (list → word → word …). */
:root{
  --bg:#f4f4f6; --bg2:#dfe0e5;
  --blob1:#ffffff; --blob2:#d3d5db; --blob3:#eceef1;
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.82);
  --stroke:rgba(255,255,255,.8); --hair:rgba(20,22,30,.09); --hair2:rgba(20,22,30,.18); --press:rgba(20,22,30,.055);
  --fg:#111216; --fg2:#4b4e58; --fg3:#80838d;
  --pre:#2f6bff; --pre-bg:rgba(47,107,255,.10);
  --stem:#7a3cf0; --stem-bg:rgba(122,60,240,.10);
  --suf:#0b9a7a; --suf-bg:rgba(11,154,122,.11);
  --accent:#2f6bff; --on-accent:#ffffff; --danger:#d93a4a;
  --h:#0b9a7a; --m:#c07a00; --l:#c2415a;
  --scrim:rgba(20,22,30,.28);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 20px 50px -26px rgba(20,22,30,.32);
  --f-disp:"Geist","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  --f-body:"Geist","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:24px; --r-md:16px;
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --bg2:#1e1e22;
  --blob1:#2e2e33; --blob2:#141417; --blob3:#3b3b41;
  --glass:rgba(30,30,34,.55); --glass-strong:rgba(44,44,50,.82);
  --stroke:rgba(255,255,255,.08); --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.2); --press:rgba(255,255,255,.06);
  --fg:#f4f4f6; --fg2:#b6b7be; --fg3:#7d7f88;
  --pre:#7aa2ff; --pre-bg:rgba(122,162,255,.14);
  --stem:#b391ff; --stem-bg:rgba(179,145,255,.14);
  --suf:#4fd6b4; --suf-bg:rgba(79,214,180,.13);
  --accent:#7aa2ff; --on-accent:#0b0c12; --danger:#ff6b7a; --h:#4fd6b4; --m:#f0b34a; --l:#ff7d93;
  --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 60px -24px rgba(0,0,0,.75);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --bg2:#1e1e22;
  --blob1:#2e2e33; --blob2:#141417; --blob3:#3b3b41;
  --glass:rgba(30,30,34,.55); --glass-strong:rgba(44,44,50,.82);
  --stroke:rgba(255,255,255,.08); --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.2); --press:rgba(255,255,255,.06);
  --fg:#f4f4f6; --fg2:#b6b7be; --fg3:#7d7f88;
  --pre:#7aa2ff; --pre-bg:rgba(122,162,255,.14);
  --stem:#b391ff; --stem-bg:rgba(179,145,255,.14);
  --suf:#4fd6b4; --suf-bg:rgba(79,214,180,.13);
  --accent:#7aa2ff; --on-accent:#0b0c12; --danger:#ff6b7a; --h:#4fd6b4; --m:#f0b34a; --l:#ff7d93;
  --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 60px -24px rgba(0,0,0,.75);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 100%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.85}
body.g-open .shell,body.g-open .aurora{visibility:hidden}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-12vw;top:-16vw;background:var(--blob1)}
.aurora i:nth-child(2){width:44vw;height:44vw;right:-12vw;top:18vh;background:var(--blob2)}
.aurora i:nth-child(3){width:48vw;height:48vw;left:28vw;bottom:-22vw;background:var(--blob3)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong)}

.glass{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%)}

/* tap feedback shared by every pressable */
.tap{transition:transform .5s var(--spring),background-color .25s ease,border-color .25s ease,box-shadow .3s ease,color .25s ease,opacity .25s ease}
.tap:active{transform:scale(.955);transition-duration:.12s,.12s,.12s,.12s,.12s,.12s}
.row.tap:active{transform:scale(.985)}

.shell{position:relative;z-index:1;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

/* header */
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;border-radius:20px;
  display:flex;align-items:center;gap:12px;padding:10px 12px;flex-wrap:wrap}
.nav-btn,.icon-btn{position:relative;width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;background:var(--press);
  color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.nav-btn svg,.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn svg{position:absolute;transition:opacity .35s var(--ease-ios),transform .45s var(--ease-ios)}
.nav-btn .i-list{opacity:0;transform:scale(.6)}
.nav-btn .i-back{opacity:0;transform:translateX(6px) scale(.6)}
.nav-btn[data-state="list"] .i-list{opacity:1;transform:none}
.nav-btn[data-state="back"] .i-back{opacity:1;transform:none}
.nav-btn[data-state="none"]{display:none}
.nav-btn .i-list circle{fill:currentColor;stroke:none}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;padding:4px 8px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;border-radius:10px;text-align:left}
.logo{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.035em;white-space:nowrap;
  background:linear-gradient(100deg,var(--fg) 0%,var(--fg3) 38%,var(--fg) 62%,var(--fg2) 100%);background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 10s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.brand span{font-family:var(--f-mono);font-size:11.5px;color:var(--fg3);letter-spacing:.04em}
.search{flex:1 1 240px;position:relative;min-width:0}
.search input{width:100%;height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--glass-strong);
  color:var(--fg);font:inherit;font-size:14.5px;padding:0 40px 0 36px;outline:none;transition:box-shadow .3s var(--ease-ios),border-color .3s}
.search input:focus{border-color:var(--fg3);box-shadow:0 0 0 4px var(--press)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--fg3)}
.clear{position:absolute;right:7px;top:50%;width:24px;height:24px;margin-top:-12px;border:0;border-radius:50%;background:var(--fg3);color:var(--bg);
  display:grid;place-items:center;padding:0;cursor:pointer;opacity:0;transform:scale(.5);pointer-events:none;
  transition:opacity .25s var(--ease-ios),transform .45s var(--spring)}
.clear.show{opacity:.9;transform:none;pointer-events:auto}
.clear.show:active{transform:scale(.82);transition-duration:.1s}
.clear svg{width:10px;height:10px;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;fill:none}
.seg{position:relative;display:flex;padding:3px;border-radius:12px;background:var(--hair);gap:2px}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--glass-strong);
  box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .5s var(--ease-ios),width .5s var(--ease-ios)}
.seg button{position:relative;z-index:1;border:0;background:transparent;color:var(--fg2);font:inherit;font-size:13px;font-weight:500;
  padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg)}
:is(button,select,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* main grid */
.main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
aside.index{border-radius:var(--r-lg);position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);
  max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
.idx-head{display:flex;gap:8px;align-items:center;padding:12px 14px 8px 18px;min-height:50px}
.idx-head .ttl{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg3);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx-head em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.sortbox{display:flex;gap:4px;align-items:center}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;height:30px;border-radius:9px;border:1px solid var(--hair);background:var(--glass-strong);
  color:var(--fg);font:inherit;font-size:12.5px;font-weight:500;padding:0 26px 0 10px;cursor:pointer}
.selwrap svg{position:absolute;right:8px;top:50%;width:11px;height:11px;margin-top:-5px;stroke:var(--fg3);fill:none;stroke-width:2.4;pointer-events:none}
.mini-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--hair);background:var(--glass-strong);color:var(--fg2);display:grid;place-items:center;padding:0;cursor:pointer}
.mini-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list{overflow:auto;padding:0 8px 10px;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:4px 8px;padding:9px 10px;border-radius:12px;cursor:pointer;
  border:0;background:transparent;width:100%;text-align:left;color:inherit;font:inherit;content-visibility:auto;contain-intrinsic-size:auto 56px}
.row[aria-current="true"]{background:var(--glass-strong);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.row .n{font-family:var(--f-mono);font-size:11.5px;color:var(--fg3);padding-top:3px;font-variant-numeric:tabular-nums}
.row .w{font-weight:600;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{grid-column:2;font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.row .forms{grid-column:2;font-family:var(--f-mono);font-size:11.5px;color:var(--fg3);margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dots{grid-column:3;grid-row:1/3;align-self:center}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair2);transition:background-color .3s,transform .45s var(--spring)}
.dots i.on{background:var(--accent);transform:scale(1.15)}
.more{margin:6px 10px 4px;font-size:12.5px;color:var(--fg3);line-height:1.6}

/* reading pane */
section.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{border-radius:var(--r-lg);padding:28px 30px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:600;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .num{font-family:var(--f-mono);letter-spacing:.02em}
.checks{display:flex;gap:7px;align-items:center}
.checks .lbl2{font-size:11px;color:var(--fg3);letter-spacing:.06em;margin-right:2px}
.ck{position:relative;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--hair2);background:var(--glass-strong);color:var(--fg2);
  cursor:pointer;display:grid;place-items:center;padding:0;font:inherit;font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.ck span{transition:opacity .2s,transform .35s var(--ease-ios)}
.ck svg{position:absolute;width:17px;height:17px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .4s var(--ease-ios) .05s}
.ck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ck[aria-pressed="true"] span{opacity:0;transform:scale(.4)}
.ck[aria-pressed="true"] svg{stroke-dashoffset:0}
h1.word{font-family:var(--f-disp);font-weight:650;font-size:clamp(40px,6vw,64px);letter-spacing:-.045em;
  line-height:1.02;margin:10px 0 20px;text-wrap:balance;overflow-wrap:anywhere}

.parts{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:24px}
.part{display:flex;flex-direction:column;gap:2px;padding:10px 14px 9px;border-radius:var(--r-md);
  border:1px solid transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.part .role{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.85}
.part .sf{font-family:var(--f-mono);font-size:19px;font-weight:500;letter-spacing:-.01em}
.part .gl{font-size:12.5px;color:var(--fg2)}
.part.prefix{background:var(--pre-bg);color:var(--pre)}
.part.stem{background:var(--stem-bg);color:var(--stem)}
.part.suffix{background:var(--suf-bg);color:var(--suf)}
.part[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent),0 12px 26px -16px currentColor}
.part.free{background:var(--hair);color:var(--fg2);cursor:default}
.plus{align-self:center;color:var(--fg3);font-family:var(--f-mono)}

.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px}
.blk h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:600;margin:0 0 10px}
ol.senses{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ol.senses li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:15px}
ol.senses li b{font-family:var(--f-mono);font-weight:500;color:var(--fg3);font-size:12px;padding-top:3px}
.etym{font-size:16px;line-height:1.85;max-width:62ch;margin:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px 3px 7px;
  border-radius:999px;background:var(--hair);letter-spacing:.02em;text-transform:none}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.h{color:var(--h)} .badge.m{color:var(--m)} .badge.l{color:var(--l)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--hair);
  background:var(--glass-strong);color:var(--fg);cursor:pointer}
.chip.off{cursor:default;color:var(--fg3);background:transparent}
.syn-ant{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.lbl{font-size:12px;color:var(--fg3);margin-bottom:6px}
.hint{font-size:13px;color:var(--fg3);margin:-8px 0 20px}
/* pronunciation, part of speech, example, idioms */
.pron{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin:-8px 0 22px}
.ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Lucida Grande","Segoe UI",var(--f-body);font-size:18px;color:var(--fg2);letter-spacing:.01em}
.posl{display:flex;gap:5px;flex-wrap:wrap}
.posl span{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--hair);color:var(--fg2);letter-spacing:.02em}
.posl span:first-child{background:var(--fg);color:var(--bg)}
.grid2.usage{margin-top:28px;padding-top:24px;border-top:1px solid var(--hair)}
.grid2.usage.one{grid-template-columns:minmax(0,1fr)}
.ex{margin:0;display:flex;flex-direction:column;gap:6px}
.ex-en{font-size:16.5px;line-height:1.7;margin:0;letter-spacing:-.005em}
.ex-en mark{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--fg3)}
.ex-ja{font-size:14px;color:var(--fg2);margin:0;line-height:1.7}
ul.idioms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.idioms li{display:flex;flex-direction:column;gap:2px;padding:10px 13px;border-radius:13px;background:var(--press)}
ul.idioms b{font-size:15px;font-weight:600;letter-spacing:-.005em}
ul.idioms span{font-size:13.5px;color:var(--fg2)}
ul.idioms li:has(.ili){padding:0;background:transparent}
.ili{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 34px 10px 13px;border-radius:13px;border:0;background:var(--press);color:inherit;font:inherit;cursor:pointer}
.ili i{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--fg3);font-size:18px}
@media (hover:hover){.ili:hover{background:var(--hair)}}
.card-foot{display:flex;justify-content:flex-end;margin-top:26px}
.ck:disabled{cursor:default;opacity:.32}
.ck[aria-pressed="true"]:disabled{opacity:.62}
.dock{position:fixed;z-index:25;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:none;gap:8px;padding:7px;border-radius:999px;opacity:0;transform:translate3d(0,24px,0) scale(.94);pointer-events:none;
  transition:opacity .3s var(--ease-ios),transform .55s var(--spring)}
.dock .ck{width:48px;height:48px;font-size:15px}
.dock .ck svg{width:20px;height:20px}
/* list: group headers and EN/JA toggles */
.grp{display:flex;align-items:baseline;justify-content:space-between;padding:14px 10px 4px;font-size:11.5px;letter-spacing:.09em;color:var(--fg3);font-weight:600}
.grp:first-child{padding-top:4px}
.grp em{font-style:normal;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tgls{display:flex;gap:3px;padding:2px;border-radius:10px;background:var(--hair)}
.tgl{height:26px;min-width:28px;padding:0 7px;border:0;border-radius:8px;background:var(--glass-strong);color:var(--fg);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.1);transition:background-color .25s,color .25s,box-shadow .25s}
.tgl[aria-pressed="false"]{background:transparent;color:var(--fg3);box-shadow:none;text-decoration:line-through;text-decoration-thickness:1.5px}
.row .w,.row .s{transition:color .3s var(--ease-ios),background-color .3s var(--ease-ios)}
.list.hide-en .row .w,.list.hide-ja .row .s{color:transparent;background:var(--hair);border-radius:6px;justify-self:start;max-width:100%;user-select:none}
#pane.dragging{transition:none}
#pane.settle{transition:transform .35s var(--ease-ios),opacity .35s var(--ease-ios)}

/* family panel */

(function(){

    cats:[['動','動詞句'],['前','前置詞句'],['副','副詞句'],['形','形容詞句'],['名','名詞句'],['接','つなぎ・談話'],['文','文・ことわざ']],
    h1:'核で、<br>イディオムをほどく。',lead:n=>`共通テストから難関大・TOEFL 110・SAT 770まで、${n}件のイディオムを、動詞・小辞・比喩の「コアイメージ」でたどれます。`,partTip:'同じコアイメージの動詞・小辞・比喩をもつイディオムが、下に並びます。'},

    kind:{prefix:'動詞の形',stem:'助動詞・法',suffix:'機能語'},etymH:'成り立ち',sensesH:'用法',synL:'類似構文',antL:'対比',exH:'例文',extraH:'判定ルール',trapH:'ひっかけ',
    posSort:'分野ごと',ph:'文法・用法・要素で検索 (例: 仮定法, would, 倒置)',gph:'文法項目を探す',
    cats:[],
    h1:'仕組みで、<br>文法をつかむ。',lead:n=>`${n}項目の文法を、時制・助動詞・機能語の「コアイメージ」に分解してつなぎます。判定ルールとひっかけで、共通テストからSAT 770まで。`,partTip:'同じコアイメージの要素を使う文法項目が、下に並びます。'}
};
let APP=APPS.word, KIND=APP.kind;
const ARTIFACT_URL='https://claude.ai/artifact/TTYw7cnD2QnAFVjTf6ozX4';
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const FIREBASE_CONFIG=window.FIREBASE_CONFIG||null;   // set in firebase-config.js (GitHub Pages)
const FB_VER='12.19.0';
const BACKEND=IN_FRAME?'claude':FIREBASE_CONFIG?'firebase':'local';
let L,W=new Map(),M=new Map(),C=new Map(),NW=0,CIS=[];
const state={mode:'word',q:'',word:null,morph:null,ci:null,sort:'num'};
const mq=window.matchMedia('(max-width:900px)');
const phone=()=>mq.matches;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let stack=[{v:'list'}], pos=0, histOK=true, LID='', randomOrder=null;
const initHash=location.hash;

function short(s){return String(s||'').replace(/^【[^】]*】/,'').split(/[、;／/]/)[0].trim()}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ================= link ID & triple checks ================= */
// one check array per mode; CH always points at the current mode's array
const CHA={word:new Uint8Array(2100),idiom:new Uint8Array(2100),grammar:new Uint8Array(2100)}, CHT={word:0,idiom:0,grammar:0};
let CH=CHA.word, chT=0;
function newId(){let s='';const a='abcdefghijkmnpqrstuvwxyz23456789';const r=new Uint32Array(8);(window.crypto||{getRandomValues:x=>{for(let i=0;i<x.length;i++)x[i]=Math.random()*4e9;return x}}).getRandomValues(r);for(const v of r)s+=a[v%a.length];return 'e'+s}
function enc(a=CH){let n=a.length-1;while(n>0&&!a[n])n--;let s='';for(let i=1;i<=n;i++)s+=a[i];return s}
// checks are sequential: 0 → ①(1) → ①②(3) → ①②③(7); legacy masks collapse to their count
function norm(v){v=(v|0)&7;return (1<<((v&1)+(v>>1&1)+(v>>2&1)))-1}
function lvl(v){return (v&1)+(v>>1&1)+(v>>2&1)}
function dec(s,a=CH){a.fill(0);if(typeof s!=='string')return;for(let i=0;i<s.length&&i+1<a.length;i++){const v=s.charCodeAt(i)-48;a[i+1]=v>=0&&v<8?norm(v):0}}
const lsKey=k=>'em-ck-'+LID+APPS[k].sfx;
function loadLocal(){
  for(const k in APPS){const a=CHA[k];a.fill(0);CHT[k]=0;const j=lsGet(lsKey(k));if(j){try{const o=JSON.parse(j);dec(o.m,a);CHT[k]=+o.t||0;if(k==='word')FB.cacheUid=o.uid||null}catch(e){}}}
  chT=CHT[APP.key];
}
function saveLocal(k){
  if(!k){CHT[APP.key]=chT;k=APP.key}
  const uid=(BACKEND==='firebase'&&FB.user)?FB.user.uid:undefined; if(uid) FB.cacheUid=uid;
  lsSet(lsKey(k),JSON.stringify({m:enc(CHA[k]),t:CHT[k],uid}));
  if(BACKEND==='claude') lsSet('em-last-id',LID);
}
const SY={db:null,ref:null,unsub:null,busy:false,again:false,timer:0,status:'local',ro:false};
async function initSync(){
  if(SY.unsub){try{SY.unsub()}catch(e){} SY.unsub=null}
  SY.ref=null; setSync('local');
  if(!(window.claude&&typeof window.claude.use==='function')) return;
  if(!SY.db){try{SY.db=await window.claude.use('db')}catch(e){SY.db=null}}
  if(!SY.db) return;
  const my=LID;
  const myApp=APP.key;
  try{SY.ref=SY.db.doc('checks/'+LID+(APP.sfx?'-'+APP.key:''))}catch(e){SY.ref=null;return}
  SY.unsub=SY.ref.onSnapshot(snap=>{
    if(my!==LID||myApp!==APP.key) return;
    setSync(SY.ro?'ro':'sync');
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(!snap.exists){ if(chT>0) queueWrite(); return }
    const d=snap.data()||{}, t=+d.t||0;
    if(t>chT){ dec(d.m); chT=t; saveLocal(); refreshChecks() }
    else if(t<chT) queueWrite();
  },()=>setSync('local'));
}
function queueWrite(){ if(!SY.ref||SY.ro) return; clearTimeout(SY.timer); SY.timer=setTimeout(doWrite,600) }
async function doWrite(){
  if(!SY.ref) return;
  if(SY.busy){SY.again=true;return}
  SY.busy=true;
  try{ await SY.ref.set({m:enc(),t:chT}) }
  catch(e){ if(e&&e.code==='invalid_argument'){SY.ro=true;setSync('ro')} else if(e&&e.code==='unavailable'){setTimeout(queueWrite,1500+Math.random()*1500)} }
  SY.busy=false;
  if(SY.again){SY.again=false;doWrite()}
}
function setSync(s){SY.status=s;renderAcct()}
function syncText(){const s=SY.status;
  return s==='sync'?'同期オン。同じリンク(ID)を開いた端末どうしで、チェックがリアルタイムに揃います。'
  :s==='ro'?'このページへの書き込み権限がないため、チェックはこの端末にだけ保存されます。'
  :s==='fb-user'?'同期オン。同じGoogleアカウントでログインした端末どうしで、チェックがリアルタイムに揃います。オフライン中の操作も、つながった時点で反映されます。'
  :s==='fb-anon'?'ゲストとしてクラウドに保存中(この端末のみ)。Googleで同期すると、今のチェックを引き継いだまま全端末で使えます。'
  :s==='fb-wait'?'同期サーバーに接続しています…'
  :s==='fb-err'?'同期サーバーに接続できません。チェックはこの端末に保存され、つながると反映されます。'
  :BACKEND==='local'?'同期は未設定です。チェックはこのブラウザに保存されます。'
  :'チェックはこのブラウザに保存されます。同じブラウザで同じリンクを開くと引き継がれます。'}
function renderAcct(){
  const n=$('#syncNote'); if(n) n.textContent=syncText();
  const dot=$('#syncdot'); if(dot) dot.dataset.s=(SY.status==='sync'||SY.status==='fb-user')?'on':SY.status==='fb-err'?'err':'off';
  const ml=$('#msec-link'), ni=$('#mi-newid'); if(ml) ml.hidden=BACKEND!=='claude'; if(ni) ni.hidden=BACKEND!=='claude';
  const a=$('#acct'); if(!a) return;
  if(BACKEND!=='firebase'){a.hidden=true;return}
  a.hidden=false;
  const u=FB.user;
  if(!u){a.innerHTML='<div class="acct-row"><span class="av">…</span><div class="acct-t"><b>接続中</b><small>しばらくお待ちください</small></div></div>';return}
  if(u.isAnonymous){a.innerHTML='<div class="acct-row"><span class="av">G</span><div class="acct-t"><b>ゲスト(この端末)</b><small>ログインすると全端末で同期</small></div></div><button class="gbtn primary tap gsign" data-act="google">Googleでログインして同期</button>';return}
  const name=u.displayName||u.email||'Google アカウント';
  a.innerHTML=`<div class="acct-row"><span class="av">${esc((name.trim()[0]||'G').toUpperCase())}</span><div class="acct-t"><b>${esc(name)}</b><small>${esc(u.email||'')}</small></div><button class="gbtn tap" data-act="signout">ログアウト</button></div>`;
}
window.addEventListener('storage',e=>{
  if(!e.newValue) return;
  for(const k in APPS) if(e.key===lsKey(k)){try{const o=JSON.parse(e.newValue);if((+o.t||0)>CHT[k]){dec(o.m,CHA[k]);CHT[k]=+o.t;if(k===APP.key){chT=CHT[k];refreshChecks()}}}catch(_){}}
});
function toggleCheck(id,bit,btn){
  const k=bit===1?0:bit===2?1:2, n=lvl(CH[id]);
  if(k===n) CH[id]=(1<<(n+1))-1; else if(k===n-1) CH[id]=(1<<k)-1; else return;
  chT=Date.now(); saveLocal();
  if(BACKEND==='firebase') fbWrite({[id]:CH[id]}); else queueWrite();
  if(btn){btn.classList.remove('bump');void btn.offsetWidth;btn.classList.add('bump')}
  refreshChecks();
}

/* ---- Firebase: anonymous guest → Google account, Firestore per-word fields ---- */
const FB={api:null,user:null,ref:null,unsub:null,cacheUid:null,noCarry:false,pend:{}};
async function initFirebase(){
  setSync('fb-wait');
  try{
    const b=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM,authM,fsM]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
    const app=appM.initializeApp(FIREBASE_CONFIG), auth=authM.getAuth(app);
    let db; try{db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}catch(e){db=fsM.getFirestore(app)}
    FB.api={authM,fsM,auth,db};
    authM.getRedirectResult(auth).catch(e=>handleAuthError(e));
    authM.onAuthStateChanged(auth,u=>{
      if(!u){ FB.user=null; FB.ref=null; renderAcct(); authM.signInAnonymously(auth).catch(()=>setSync('fb-err')); return }
      attachUser(u);
    });
  }catch(e){ console.error(e); setSync('fb-err') }
}
function snapCH(a){const c={};for(let i=1;i<a.length;i++) if(a[i]) c[i]=a[i];return c}
// Firestore users/{uid}: { c:{word checks}, ci:{idiom checks}, cg:{grammar checks}, t }
function attachUser(u){
  const {fsM,db}=FB.api;
  if(FB.unsub){FB.unsub();FB.unsub=null}
  // carry this device's checks into the account only when they came from a different (guest) account
  const carry=(!FB.noCarry&&FB.cacheUid!==u.uid)?Object.fromEntries(Object.keys(APPS).map(k=>[k,snapCH(CHA[k])])):null;
  FB.noCarry=false;

    const d=(snap.exists()&&snap.data())||{};

      const f=APPS[key].field, c=Object.assign({},d[f]||{}), a=CHA[key];
      if(first){
        const upd={}, pend=FB.pend[f]||{};
        if(carry) for(const k in carry[key]){const nv=norm((c[k]|0)|carry[key][k]); if(nv!==(c[k]|0)) upd[k]=nv}
        for(const k in pend){ if((c[k]|0)!==pend[k]) upd[k]=pend[k] }
        if(Object.keys(upd).length){ Object.assign(c,upd); fbWrite(upd,f) }

async function handleAuthError(e,provider){
  if(!FB.api) return;

  provider=provider||new authM.GoogleAuthProvider();

}

function shuffleOrder(){const a=L.words.map(w=>w.id);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}randomOrder=new Map(a.map((id,k)=>[id,k]))}

const CATS=()=>APP.cats.length?APP.cats:((L.meta&&L.meta.cats)||[]);
const POS_ORDER_=()=>CATS().map(c=>c[0]);
const posName=p=>{const c=CATS().find(c=>c[0]===p);return c?c[1]:p};
const posIdx=w=>{const i=POS_ORDER_().indexOf((w.pos||[])[0]);return i<0?99:i};
const lvIdx=w=>w.lv||9;
// the word list exactly as the index shows it (search + sort); also drives swipe order
function listWords(q,sort){
  q=(q??state.q).trim().toLowerCase(); sort=sort||state.sort;
  const num=/^\d+$/.test(q)?+q:null;
  let res=L.words.filter(w=>!q||(num!==null?w.id===num||String(w.id).startsWith(q):w._s.includes(q)));
  if(sort==='checked') res=res.filter(w=>CH[w.id]);
  if(sort==='alpha') res.sort((a,b)=>a.word.localeCompare(b.word,'en',{sensitivity:'base'})||a.id-b.id);
  else if(sort==='random'){ if(!randomOrder) shuffleOrder(); res.sort((a,b)=>randomOrder.get(a.id)-randomOrder.get(b.id)) }
  else if(sort==='pos') res.sort((a,b)=>posIdx(a)-posIdx(b)||(q&&num===null?rank(a,q)-rank(b,q):0)||a.id-b.id);
  else if(sort==='level') res.sort((a,b)=>lvIdx(a)-lvIdx(b)||(q&&num===null?rank(a,q)-rank(b,q):0)||a.id-b.id);
  else if(q&&num===null) res.sort((a,b)=>rank(a,q)-rank(b,q)||a.id-b.id);
  return res;
}

function neighbor(d){
  const id=state.word; if(!id) return null;
  let ids=(state.mode==='word'?listWords():listWords('')).map(w=>w.id);
  if(!ids.includes(id)) ids=listWords('').map(w=>w.id);
  if(!ids.includes(id)) ids=listWords('','num').map(w=>w.id);
  const i=ids.indexOf(id)+d;

}

function openFromGraph(id){
  closeGraph(true);
  if(histOK&&history.state&&history.state.g){try{history.replaceState({i:pos},'',hashOf(stack[pos]))}catch(e){}}
  if(state.word===id&&stack[pos].v==='word') return;
  push({v:'word',id},'push');
}
function stepCi(d){
  let k=CIS.indexOf(GR.ci); k=k<0?0:(k+d+CIS.length)%CIS.length;
  setGraph('meaning',CIS[k]);
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if($('#menu').classList.contains('open')&&!e.target.closest('#menu,#menuBtn')) closeMenu();
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.mact){ const f=modalOk; hideModal(); if(t.dataset.mact==='ok'&&f) f(); return }
  if(t.id==='menuBtn'){ $('#menu').classList.contains('open')?closeMenu():openMenu(); return }
  if(t.dataset.act){ closeMenu(); const a=t.dataset.act;
    if(a==='copy') copyLink(); else if(a==='reset') resetAll(); else if(a==='newid') startNewId();
    else if(a==='google') signInGoogle(); else if(a==='signout') signOutFB();
    else if(a==='random') push({v:'word',id:L.words[Math.floor(Math.random()*NW)].id},'push',true);
    else if(a==='graph') openGraph();
    return }
  if(t.dataset.app){ switchApp(t.dataset.app); return }
  if(t.dataset.x){ // cross-mode link (e.g. idiom → its key word in 英単語)
    const k=t.dataset.x; let id=+t.dataset.xw||0;
    loadData(k).then(d=>{ if(!id){const q=(t.dataset.xq||'').toLowerCase(); const w=d.L.words.find(w=>w.word.toLowerCase()===q); id=w?w.id:0}
      if(id) switchApp(k,id); else toast('見つかりませんでした') }).catch(()=>toast('読み込めませんでした'));
    return }
  if(t.dataset.gz){ GR.zoomG=clampZ(GR.zoomG*+t.dataset.gz); GR.yawG=null; GR.last=performance.now(); GR.dirty=true; return }
  if(t.dataset.greset!==undefined){ resetView(); return }
  if(t.dataset.ginfox!==undefined){ selectG(-1); return }
  if(t.id==='home'){ goHome(); return }
  if(t.id==='qclear'){ clearSearch(true); return }
  if(t.id==='shuffle'){ shuffleOrder(); renderList(); animateEl($('#list'),'a-fade'); return }
  if(t.id==='tgl-en'||t.id==='tgl-ja'){ const l=$('#list'); applyHide(t.id==='tgl-en'?!l.classList.contains('hide-en'):l.classList.contains('hide-en'), t.id==='tgl-ja'?!l.classList.contains('hide-ja'):l.classList.contains('hide-ja')); return }
  if(t.id==='graphBtn'){ openGraph(); return }
  if(t.id==='gclose'){ closeGraph(false); return }
  if(t.dataset.gmode){ if(t.dataset.gmode!==GR.mode){ if(t.dataset.gmode==='meaning'&&GR.ctxWord) GR.ci=defaultCi(GR.ctxWord); setGraph(t.dataset.gmode,GR.ci) } return }
  if(t.dataset.gstep){ stepCi(+t.dataset.gstep); return }
  if(t.dataset.gopen){ openFromGraph(+t.dataset.gopen); return }
  if(t.dataset.gword){ GR.ctxWord=+t.dataset.gword; setGraph('meaning',defaultCi(GR.ctxWord)); return }
  if(t.dataset.gci){ setGraph('meaning',t.dataset.gci); return }
  if(t.dataset.ck){ toggleCheck(+t.dataset.ckw,+t.dataset.ck,t); return }
  if(t.id==='nav'){ t.dataset.state==='back'?goBack():goList(); return }
  if(t.dataset.mode){ if(t.dataset.mode!==state.mode) setMode(t.dataset.mode); return }
  if(t.dataset.close!==undefined){ toggleFamily(state.morph); return }
  if(t.dataset.m){ toggleFamily(t.dataset.m); return }
  if(t.dataset.ci){ push({v:'group',ci:t.dataset.ci},'push',true); return }
  if(t.dataset.w){
    const id=+t.dataset.w;
    if(t.dataset.from==='list'){ if(!phone()&&id===state.word&&pos<=1) return; push({v:'word',id},'push',true); return }
    if(id===state.word) return;
    let morph=null;
    if(t.closest('.family')&&state.morph){
      const ci=M.get(state.morph).ci, p=W.get(id).parts.find(p=>p.morpheme&&M.get(p.morpheme).ci===ci);
      if(p) morph=p.morpheme;
    }
    push({v:'word',id,morph},'push');
  }
});
$('#sort').addEventListener('change',e=>{
  state.sort=e.target.value; lsSet('em-sort'+APP.sfx,state.sort);
  if(state.sort==='random') shuffleOrder();
  updateSortUI(); renderList(); animateEl($('#list'),'a-fade');
  const l=$('#list'); if(l) l.scrollTop=0;
});
let tmr;
$('#q').addEventListener('input',e=>{updateClear();clearTimeout(tmr);tmr=setTimeout(()=>{state.q=e.target.value;renderList()},90)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('#list .row');f&&f.click()}});
document.addEventListener('keydown',e=>{
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state.word&&!GR.open&&!e.altKey&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey
    &&!e.target.closest('input,textarea,select')&&!$('#modal').classList.contains('open')){e.preventDefault();stepWord(e.key==='ArrowRight'?1:-1);return}
  if(e.key!=='Escape') return;
  if($('#modal').classList.contains('open')){hideModal();return}
  if($('#menu').classList.contains('open')){closeMenu();return}
  if(GR.open) closeGraph(false);
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal()});
$('#gfind').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findGraph(e.target.value)}});
$('#gfind').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();if(v&&L&&L.words.some(w=>w.word.toLowerCase()===v))findGraph(v)});

boot();
})();
</script>
